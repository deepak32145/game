# Rendered to /etc/nginx/conf.d/pitch-duel.conf by remote-setup.sh (__DOMAIN__ is replaced).
# certbot later adds the HTTPS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for Socket.IO (live lobby and match play)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
